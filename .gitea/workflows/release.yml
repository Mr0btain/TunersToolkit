# Builds the Linux packages (the arm64 DEB emulated through QEMU), the Windows MSI, the APK, the desktop jar and the
# web zip, and publishes a Gitea release when a v* tag is pushed (git tag v0.1.0 && git push origin v0.1.0). Run it by
# hand to build without publishing. The macOS DMGs need a Mac runner, which .github/workflows/release.yml has on
# GitHub. See docs/releasing.md
#
# Gitea only runs actions/upload-artifact and download-artifact v3, not v4
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_arm64:
        description: Skip the arm64 DEB (it's emulated, so slow)
        type: boolean
        default: false
      skip_windows:
        description: Skip the Windows MSI (needs the windows-latest runner online)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^tunerstoolkit.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tunerstoolkit.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The APK and DEB are built on x86: the AAPT2 Gradle downloads doesn't run on ARM Linux, and the DEB is for the
  # runner's own architecture. Beside the DEB goes a tarball of the same app, and the web zip and desktop jar come
  # from here too
  packages:
    name: DEB, tarball, APK, jar and web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      # jpackage makes the DEB with these
      - name: Packaging tools
        run: command -v fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNERSTOOLKIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No TUNERSTOOLKIT_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TUNERSTOOLKIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The build names each file (TunersToolkit-Linux-<version>-x64.deb, TunersToolkit-Android-<version>.apk, see
      # docs/releasing.md), so they're only collected. The all platform jar is a separate run, since -PallPlatforms
      # changes the desktop dependencies
      - name: Build
        env:
          TUNERSTOOLKIT_KEYSTORE_PASSWORD: ${{ secrets.TUNERSTOOLKIT_KEYSTORE_PASSWORD }}
          TUNERSTOOLKIT_KEY_ALIAS: ${{ secrets.TUNERSTOOLKIT_KEY_ALIAS }}
          TUNERSTOOLKIT_KEY_PASSWORD: ${{ secrets.TUNERSTOOLKIT_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:packageDeb :composeApp:packageTarball :androidApp:assembleRelease :composeApp:packageWebZip
          ./gradlew :composeApp:packageUberJarForCurrentOS -PallPlatforms
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/TunersToolkit-*.deb dist/
          cp composeApp/build/compose/binaries/main/tar/TunersToolkit-*.tar.gz dist/
          cp androidApp/build/outputs/apk/release/TunersToolkit-*.apk dist/
          cp composeApp/build/dist/web/TunersToolkit-Web-*.zip dist/
          cp composeApp/build/compose/jars/TunersToolkit-Desktop-*.jar dist/

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: packages
          path: dist/

  # The Compose desktop app bundles a Java runtime and native graphics for the machine that builds it, so the arm64
  # DEB and tarball are built in an arm64 container emulated through QEMU (docker/deb.Dockerfile). Needs a runner with
  # Docker access. Skipped by the skip_arm64 input of a run by hand, or for tags by setting SKIP_ARM64 to true
  deb-arm64:
    name: DEB and tarball (arm64)
    needs: version
    if: format('{0}', inputs.skip_arm64) != 'true' && vars.SKIP_ARM64 != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Built through the host's Docker daemon, so the result comes back with --output rather than a mounted folder
      - name: Package
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx build --platform linux/arm64 -f docker/deb.Dockerfile --output type=local,dest=dist .

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: deb-arm64
          path: dist/

  # jpackage only makes an MSI on Windows, so this needs a Windows runner registered with the windows-latest:host label
  # (docs/releasing.md). Skipped by the skip_windows input of a run by hand, or for tags by setting SKIP_WINDOWS to true
  msi:
    name: MSI (Windows)
    needs: version
    if: format('{0}', inputs.skip_windows) != 'true' && vars.SKIP_WINDOWS != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      # Host mode reuses the machine between runs, so no Gradle or Kotlin daemon is left behind holding files open
      - name: Package
        run: |
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :composeApp:packageMsi
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/TunersToolkit-*.msi dist/

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: msi
          path: dist/

  release:
    name: Publish
    needs: [version, packages, deb-arm64, msi]
    # Publishes without whatever was skipped, but not when anything failed or was cancelled
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.version.result == 'success'
      && needs.packages.result == 'success'
      && (needs.deb-arm64.result == 'success' || needs.deb-arm64.result == 'skipped')
      && (needs.msi.result == 'success' || needs.msi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
      - uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          files: dist/*
          # 0.x and -rc versions are betas
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
