# Tests and builds on every pull request, and on pushes to main. .github/workflows/ci.yml is the same for GitHub,
# plus an iOS compile on a Mac runner
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # The compileSdk platform from gradle/libs.versions.toml, for the Android builds at the end
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-37.0

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Core tests
        run: ./gradlew :core:jvmTest

      # Skia's native library links against these even when it draws without a display, and the runner image leaves
      # them out
      - name: Skia libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-6 libfontconfig1

      - name: App tests
        run: ./gradlew :composeApp:desktopTest

      - name: Web, Android and desktop builds
        run: ./gradlew :composeApp:compileKotlinWasmJs :composeApp:compileKotlinDesktop :androidApp:assembleDebug

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            composeApp/build/reports/tests/
