# Versions follow TicketMan (github.com/Mr0btain/TicketMan) so the two projects can share the UI kit later
[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "25"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
composeMultiplatform = "1.12.2"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
# The one FileKit uses; project files on desktop, Android and iOS
kotlinx-io = "0.9.1"
koin = "4.2.2"
compose-navigation = "2.9.2"
material3 = "1.9.0"
filekit = "0.16.0"
jna = "5.14.0"
# Our shared libraries (Tm-AppLogger, Tm-UI-Kit)
tm-applogger = "0.1.0"
tm-uikit = "0.2.0"
# The last release; Compose stopped bundling icons. Only the old dropdowns use them, the UI kit won't
materialIcons = "1.7.3"

[libraries]
# Compose
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIcons" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Shared with TicketMan
tm-applogger = { module = "org.mr0btain:tm-applogger", version.ref = "tm-applogger" }
tm-ui-kit = { module = "org.mr0btain:tm-ui-kit", version.ref = "tm-uikit" }
tm-ui-kit-rules = { module = "org.mr0btain:tm-ui-kit-rules", version.ref = "tm-uikit" }

# Kotlin
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-composeVM = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Files
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

# Desktop: OS specific app data folders (components/datastorage/components/*DirectoryResolver)
jna = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

[bundles]
koin = ["koin-core", "koin-compose", "koin-composeVM"]
fileKit = ["filekit-core", "filekit-dialogs", "filekit-dialogs-compose"]

[plugins]
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialize = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
