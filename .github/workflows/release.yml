# Builds every package (installers and tarballs, the APK, the desktop jar and the web zip) and publishes a GitHub release
# when a v* tag is pushed (git tag v0.1.0 && git push origin v0.1.0). Run it by hand (Actions > Release > Run workflow)
# to build without publishing. It makes the same files as .gitea/workflows/release.yml, plus the DMGs (arm64 and x64).
# See docs/releasing.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_windows:
        description: Skip the Windows MSIs
        type: boolean
        default: false
      skip_mac:
        description: Skip the macOS DMGs
        type: boolean
        default: false
      skip_linux:
        description: Skip the Linux DEBs and tarballs
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Also picks which installers to build, since a matrix entry can't be skipped on its own
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.desktop.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^tunerstoolkit.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tunerstoolkit.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each one is left out by its input on a run by hand, or for tags by its variable set to true
      - id: desktop
        name: Installers to build
        env:
          SKIP_WINDOWS: ${{ format('{0}', inputs.skip_windows) == 'true' || vars.SKIP_WINDOWS == 'true' }}
          SKIP_MAC: ${{ format('{0}', inputs.skip_mac) == 'true' || vars.SKIP_MAC == 'true' }}
          SKIP_LINUX: ${{ format('{0}', inputs.skip_linux) == 'true' || vars.SKIP_LINUX == 'true' }}
        run: |
          entries=()
          [ "$SKIP_WINDOWS" != true ] && entries+=('{"os":"windows-latest","format":"msi","task":"packageMsi"}')
          # jpackage can't cross build, so each architecture needs a runner of its own
          [ "$SKIP_WINDOWS" != true ] && entries+=('{"os":"windows-11-arm","format":"msi","task":"packageMsi"}')
          # macos-latest is Apple silicon; Intel Macs need a DMG built on an Intel runner
          [ "$SKIP_MAC" != true ] && entries+=('{"os":"macos-latest","format":"dmg","task":"packageDmg"}')
          [ "$SKIP_MAC" != true ] && entries+=('{"os":"macos-15-intel","format":"dmg","task":"packageDmg"}')
          [ "$SKIP_LINUX" != true ] && entries+=('{"os":"ubuntu-latest","format":"deb","task":"packageDeb"}')
          # Free for public repos; a private one needs ARM runners on its plan
          [ "$SKIP_LINUX" != true ] && entries+=('{"os":"ubuntu-24.04-arm","format":"deb","task":"packageDeb"}')
          echo "matrix={\"include\":[$(IFS=,; echo "${entries[*]}")]}" >> "$GITHUB_OUTPUT"

  # jpackage only builds installers for the system it runs on, so one runner per installer. Beside each DEB goes a
  # tarball of the same app (bin/TunersToolkit starts it) for systems without dpkg
  desktop:
    name: Desktop (${{ matrix.format }}, ${{ matrix.os }})
    needs: version
    if: fromJSON(needs.version.outputs.desktop).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # jpackage makes the DEB with these
      - name: Packaging tools
        if: matrix.format == 'deb'
        run: command -v fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      # The build names each file (TunersToolkit-Linux-<version>-x64.deb, TunersToolkit-macOS-<version>-arm64.dmg, see
      # docs/releasing.md), so they're only collected
      - name: Package
        run: |
          tarball=$([ "${{ matrix.format }}" = deb ] && echo :composeApp:packageTarball || true)
          ./gradlew :composeApp:${{ matrix.task }} $tarball
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/${{ matrix.format }}/TunersToolkit-*.${{ matrix.format }} dist/
          if [ -n "$tarball" ]; then cp composeApp/build/compose/binaries/main/tar/TunersToolkit-*.tar.gz dist/; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.format }}-${{ runner.arch }}
          path: dist/

  # One jar for every desktop system (-PallPlatforms puts each one's Skia in), run with java -jar on Java 21
  desktop-jar:
    name: Desktop jar
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Package
        run: |
          ./gradlew :composeApp:packageUberJarForCurrentOS -PallPlatforms
          mkdir -p dist
          cp composeApp/build/compose/jars/TunersToolkit-Desktop-*.jar dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-jar
          path: dist/

  # The APK (signed when the TUNERSTOOLKIT_KEYSTORE* secrets are set, see docs/releasing.md) and the web zip
  android-web:
    name: Android and web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNERSTOOLKIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No TUNERSTOOLKIT_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TUNERSTOOLKIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          TUNERSTOOLKIT_KEYSTORE_PASSWORD: ${{ secrets.TUNERSTOOLKIT_KEYSTORE_PASSWORD }}
          TUNERSTOOLKIT_KEY_ALIAS: ${{ secrets.TUNERSTOOLKIT_KEY_ALIAS }}
          TUNERSTOOLKIT_KEY_PASSWORD: ${{ secrets.TUNERSTOOLKIT_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease :composeApp:packageWebZip
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/TunersToolkit-*.apk dist/
          cp composeApp/build/dist/web/TunersToolkit-Web-*.zip dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-web
          path: dist/

  release:
    name: Publish
    needs: [version, desktop, desktop-jar, android-web]
    # Publishes without whatever was skipped, but not when anything failed or was cancelled
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.version.result == 'success'
      && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
      && needs.desktop-jar.result == 'success'
      && needs.android-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: '{desktop,android}*'
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 0.x and -rc versions are betas
          prerelease=""
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Tuners Toolkit $VERSION" --generate-notes $prerelease
