# Tests and builds on every pull request, and on pushes to main. A copy of .gitea/workflows/ci.yml for GitHub, plus an
# iOS compile on a Mac runner. Keep the two in step
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # The compileSdk platform from gradle/libs.versions.toml, for the Android builds at the end
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platforms;android-37.0

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Core tests
        run: ./gradlew :core:jvmTest

      # Skia's native library links against these even when it draws without a display, and the runner image leaves
      # them out
      - name: Skia libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-6 libfontconfig1

      - name: App tests
        run: ./gradlew :composeApp:desktopTest

      - name: Web, Android and desktop builds
        run: ./gradlew :composeApp:compileKotlinWasmJs :composeApp:compileKotlinDesktop :androidApp:assembleDebug

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            composeApp/build/reports/tests/

  ios:
    name: iOS compile
    runs-on: macos-latest
    timeout-minutes: 60
    # The iOS code hasn't been compiled since the move to the new project layout (nothing on Linux builds it), so
    # this reports without failing the run until it's been made to pass once
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Kotlin for iOS
        run: ./gradlew :core:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosSimulatorArm64
